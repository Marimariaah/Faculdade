<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB6C1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF69B4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="frosting" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFDAB9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB6C1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Base do cupcake -->
  <path d="M 60 120 Q 60 150 100 160 Q 140 150 140 120 Z" fill="#D4A574" />
  <!-- Parte de cima (frosting) -->
  <path d="M 65 120 Q 65 80 100 50 Q 135 80 135 120 Z" fill="url(#frosting)" />
  <!-- Brilho frosting -->
  <ellipse cx="85" cy="75" rx="15" ry="20" fill="#FFCCCB" opacity="0.5" />
  <!-- Graninha decorativa -->
  <circle cx="100" cy="60" r="3" fill="#FFD700" />
  <circle cx="110" cy="70" r="2" fill="#FFD700" />
  <circle cx="90" cy="75" r="2" fill="#FFD700" />
</svg>